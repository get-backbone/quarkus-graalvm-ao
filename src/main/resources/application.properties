# HTTP
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Postgres (task compose:up publishes host port 5432)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ao_demo
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.datasource.devservices.enabled=false

# Redis cache + kit throttle (task compose:up publishes host port 6379)
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.devservices.enabled=false
quarkus.cache.type=redis
quarkus.cache.redis."ping".expire-after-write=1m
quarkus.cache.redis."ping".value-type=io.backbone.demo.ao.PingResponse

# backbone-kit throttle (Redis-backed reference filter)
backbone.rate-limit.reference.enabled=true
rate-limit.store=redis
rate-limit.authenticated-capacity-per-minute=1000
rate-limit.unauthenticated-capacity-per-minute=100
rate-limit.authenticated-refill-per-second=100
rate-limit.unauthenticated-refill-per-second=10

# Health / metrics (Vert.x binder NPE under AO — see README)
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.vertx.enabled=false
quarkus.smallrye-health.root-path=/q/health

# Compose service hostnames when running the AO container (%prod)
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/ao_demo
%prod.quarkus.redis.hosts=redis://redis:6379

# jansi must initialize at run time for native.
# task ao:build merges this with -H:AdvancedObfuscation (CLI additional-build-args replaces this property).
quarkus.native.additional-build-args=--initialize-at-run-time=org.fusesource.jansi

%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.redis.devservices.enabled=false
